version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: proxispeak-server:1.0.0
    container_name: proxispeak_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/proxispeak
      - REDIS_URL=redis://redis:6379
      - CLIENT_ORIGIN=http://localhost:5173,http://localhost:3000,http://localhost:5000
      - EARSHOT_RADIUS_PIXELS=100
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - proxispeak-net

  redis:
    image: redis:7-alpine
    container_name: proxispeak_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - proxispeak-net

  mongodb:
    image: mongo:7.0
    container_name: proxispeak_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - proxispeak-net

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  proxispeak-net:
    driver: bridge
