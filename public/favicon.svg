<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Modern Rounded App Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Left Spatial Sound Waves (Stereo Left) -->
  <path d="M 22 22 A 14 14 0 0 0 22 42" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 15 15 A 24 24 0 0 0 15 49" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Center Proximity Core Beacon -->
  <circle cx="32" cy="32" r="7.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4" fill="#0284c7"/>

  <!-- Right Spatial Sound Waves (Stereo Right) -->
  <path d="M 42 22 A 14 14 0 0 1 42 42" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 49 15 A 24 24 0 0 1 49 49" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
</svg>
